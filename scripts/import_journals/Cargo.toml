[package]
name = "import_journals"
version = "0.1.0"
edition = "2021"
description = "Import journal index CSV files into the Bango portal SQLite database"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "6"