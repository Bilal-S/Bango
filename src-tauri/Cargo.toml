[package]
name = "bango"
version = "2.0.1"
description = "AI-Powered Systematic Literature Review Tool"
authors = ["BonCode"]
edition = "2021"

[lib]
name = "bango_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
tauri-plugin-pilot = "0.7"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
 resvg = { version = "0.45", default-features = false, features = ["text"] }
 fontdb = { version = "0.23", features = ["fs"] }
 dirs = "6"
 pdf-extract = "0.10"
 lopdf = "0.34"
headless_chrome = "1"
rand = "0.10"
regex = "1"
rust-stemmers = "1.2"
once_cell = "1.18"

[dev-dependencies]
mockito = "1"
tempfile = "3"

 [lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
