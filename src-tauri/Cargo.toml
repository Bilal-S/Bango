[package]
name = "bango"
version = "1.0.5"
description = "AI-Powered Systematic Literature Review Tool"
authors = ["BonCode"]
edition = "2021"

[lib]
name = "bango_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
tauri-plugin-pilot = { git = "https://github.com/mpiton/tauri-pilot" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
resvg = { version = "0.44", default-features = false, features = ["text"] }
fontdb = { version = "0.22", features = ["fs"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
