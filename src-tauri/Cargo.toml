[package]
name = "bango"
version = "2.5.5"
description = "AI-Powered Systematic Literature Review Tool"
authors = ["BonCode"]
edition = "2021"

[lib]
name = "bango_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
tauri-plugin-pilot = "0.7"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
 resvg = { version = "0.45", default-features = false, features = ["text"] }
 fontdb = { version = "0.23", features = ["fs"] }
 dirs = "6"
 pdf-extract = "0.10"
 lopdf = "0.34"
headless_chrome = "1"
rand = "0.10"
regex = "1"
rust-stemmers = "1.2"
 once_cell = "1.18"
 unpdf = "0.7.0"
# Charset detection + decoding for legacy CJK PDFs whose fonts use Shift-JIS /
# EUC-JP / CP949 / GB18030 byte encodings without a ToUnicode CMap. `unpdf`
# returns those raw byte values as Latin-1 code points (mojibake); the recovery
# pass in `utils::pdf_extract::recover_mojibake` re-decodes them.
encoding_rs = "0.8"
chardetng = "0.1"

[dev-dependencies]
mockito = "1"
tempfile = "3"
proptest = "1"

# Clippy lint config. The lints that fire on idiomatic test patterns
# (`unwrap_used`, `expect_used`, `panic`) are NOT escalated here because the
# crate-level table applies to integration test crates (`tests/*.rs`) too.
# Instead, the library crate re-asserts them via
# `#![cfg_attr(not(test), warn(...))]` in `src/lib.rs`, so the
# `cargo clippy -- -D warnings` gate still denies them in production code
# while allowing them in test code (both inline `#[cfg(test)]` modules and
# the separate `tests/*.rs` crates).
[lints.clippy]
todo = "warn"
dbg_macro = "warn"
