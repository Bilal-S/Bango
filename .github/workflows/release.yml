name: Release

on:
  push:
    tags:
      - 'v*'

# Cancel in-progress runs for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # Build standard bundles (NSIS, deb, AppImage, dmg)
  # ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          # Strip leading 'v' from the tag: v1.0.0 → 1.0.0
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync version across config files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;

            // package.json
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = v;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            // src-tauri/tauri.conf.json
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = v;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");

            // src-tauri/Cargo.toml
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = ".*"/m, "version = \"" + v + "\"");
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
          '

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install macOS build dependencies
        if: matrix.platform == 'macos-latest'
        run: brew install create-dmg

      - name: Install JS dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bango ${{ github.ref_name }}'
          releaseBody: |
            See the assets below to download the installer for your platform.

            **Changes:** See the commit history since the last release for details.
          releaseDraft: false
          prerelease: false

  # ──────────────────────────────────────────────
  # Build MSIX for Microsoft Store
  # ──────────────────────────────────────────────
  build-msix:
    name: Build MSIX (Microsoft Store)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync version across config files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;

            // package.json
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = v;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            // src-tauri/tauri.conf.json
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = v;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");

            // src-tauri/Cargo.toml
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = ".*"/m, "version = \"" + v + "\"");
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
          '

      - name: Install JS dependencies
        run: npm ci

      - name: Build app (no bundle)
        run: npm run tauri build -- --no-bundle

      - name: Install msixbundle-cli
        run: cargo install msixbundle-cli

      - name: Bundle MSIX
        run: npm run tauri:windows:build -- --runner npm

      - name: Upload MSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/msix/*.msixbundle
          name: 'Bango ${{ github.ref_name }}'
          body: |
            See the assets below to download the installer for your platform.

            **Changes:** See the commit history since the last release for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup msstore CLI
        run: winget install Microsoft.msstore-cli

      - name: Publish to Microsoft Store
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
        run: |
          $msix = Get-ChildItem -Path "src-tauri/target/msix" -Filter "*.msixbundle" -Recurse | Select-Object -First 1
          if ($msix) {
            Write-Host "Publishing $($msix.FullName) to Microsoft Store..."
            msstore publish --appId $env:MS_STORE_APP_ID --packagePath $msix.FullName
          } else {
            Write-Error "MSIX package not found!"
            exit 1
          }

  # ──────────────────────────────────────────────
  # Post-build: commit version-synced config files
  # ──────────────────────────────────────────────
  sync-version:
    name: Sync version to config files
    needs: [build, build-msix]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync version across config files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # package.json
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          # src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          # src-tauri/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Commit and push version sync
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore(release): sync version to $VERSION"
          git push
