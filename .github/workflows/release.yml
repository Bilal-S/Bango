name: Release

on:
  push:
    tags:
      - 'v*'

# Cancel in-progress runs for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Synchronise version across config files
  # ──────────────────────────────────────────────
  version-sync:
    name: Version Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Extract version from tag
        id: version
        run: |
          # Strip leading 'v' from the tag: v1.0.0 → 1.0.0
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install JS dependencies
        run: npm ci

      - name: Sync version to package.json, tauri.conf.json, and Cargo.toml
        run: npx tauri version "${{ steps.version.outputs.version }}"

      - name: Commit and push version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git checkout "$DEFAULT_BRANCH"
          git add -A
          git commit -m "chore(release): sync version to ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push origin "$DEFAULT_BRANCH"

  # ──────────────────────────────────────────────
  # Job 2: Build & release on all platforms
  # ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    needs: version-sync
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install JS dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bango ${{ github.ref_name }}'
          releaseBody: |
            See the assets below to download the installer for your platform.

            **Changes:** See the commit history since the last release for details.
          releaseDraft: false
          prerelease: false